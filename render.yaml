services:
  - type: web
    name: malwarelens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_EMAIL_VERIFY
        value: "0"
      - key: MALWARELENS_DB
        value: /tmp/malwarelens.db
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM_NAME
        value: MalwareLens
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false