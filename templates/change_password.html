<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | MalwareLens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="{{ body_class }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include 'partials/_shell_open.html' %}
        

        

        <main class="app-main results-main" id="main-content">
            <section class="card">
                <h2>🔑 Change Password</h2>
                <p class="subtitle">Verified against your current password before applying any change.</p>

                <form method="post" action="{{ url_for('change_password') }}" class="settings-form" style="max-width:420px">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                    <label class="form-label" for="current_password">Current password</label>
                    <input class="form-input" type="password" id="current_password" name="current_password" required autocomplete="current-password">

                    <label class="form-label" for="new_password">New password</label>
                    <input class="form-input" type="password" id="new_password" name="new_password" minlength="8" required autocomplete="new-password">
                    <p class="muted small">At least 8 characters.</p>

                    <label class="form-label" for="confirm_password">Confirm new password</label>
                    <input class="form-input" type="password" id="confirm_password" name="confirm_password" minlength="8" required autocomplete="new-password">

                    <button type="submit" class="btn btn-primary">Update Password</button>
                </form>

                <p style="margin-top:18px"><a href="{{ url_for('dashboard') }}" class="muted">← Back to Dashboard</a></p>
            </section>
        </main>
{% include 'partials/_shell_close.html' %}

        </div>

    <script>
    (function () {
        const form = document.querySelector('.settings-form');
        if (form) {
            form.addEventListener('submit', function (e) {
                const a = form.querySelector('#new_password').value;
                const b = form.querySelector('#confirm_password').value;
                if (a !== b) {
                    e.preventDefault();
                    alert('New passwords do not match.');
                }
            });
        }
    })();
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
